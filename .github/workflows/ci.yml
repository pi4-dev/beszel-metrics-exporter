name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Render mocked metrics
        run: PYTHONPATH=.:tests python tests/render_mock_metrics.py > /tmp/beszel.metrics

      - name: Validate Compose env and automatic override
        run: |
          cp beszel-metrics-exporter.env.example beszel-metrics-exporter.env
          # A legacy .env must not override the project-specific runtime settings.
          printf 'BESZEL_URL=http://ignored-legacy:8090\n' > .env
          docker compose config --quiet
          grep -Fx '    env_file: beszel-metrics-exporter.env' docker-compose.yaml
          docker compose config --format json | python -c 'import json,sys; s=json.load(sys.stdin)["services"]["beszel-metrics-exporter"]; assert s["environment"]["BESZEL_URL"] == "http://beszel:8090"; assert any(p.get("host_ip") == "127.0.0.1" and p.get("published") == "9105" for p in s["ports"])'
          for f in .env beszel-metrics-exporter.env docker-compose.override.yaml; do git check-ignore -q "$f"; done
          cat > docker-compose.override.yaml <<'YAML'
          services:
            beszel-metrics-exporter:
              environment:
                COMPOSE_OVERRIDE_TEST: enabled
          YAML
          docker compose config --quiet
          docker compose config --format json | python -c 'import json,sys; s=json.load(sys.stdin)["services"]["beszel-metrics-exporter"]; assert s["environment"]["COMPOSE_OVERRIDE_TEST"] == "enabled"; assert s["environment"]["BESZEL_URL"] == "http://beszel:8090"; assert any(p.get("host_ip") == "127.0.0.1" and p.get("published") == "9105" for p in s["ports"])'

      - name: Validate Prometheus exposition
        run: docker run --rm -i --entrypoint /bin/promtool prom/prometheus:v3.15.0 check metrics < /tmp/beszel.metrics

      - name: Build container
        run: docker build -t beszel-metrics-exporter:test .

      - name: Smoke-test container startup and failure-mode metrics
        run: |
          docker run -d --rm --name beszel-metrics-exporter-test -p 127.0.0.1:9105:9105 beszel-metrics-exporter:test
          trap 'docker logs beszel-metrics-exporter-test || true; docker stop beszel-metrics-exporter-test || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9105/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9105/healthz
          curl -fsS http://127.0.0.1:9105/metrics | grep '^beszel_exporter_up 0$'
