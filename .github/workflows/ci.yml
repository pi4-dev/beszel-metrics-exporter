name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m py_compile beszel_exporter.py

      - name: Build container
        run: docker build -t beszel-metrics-exporter:test .

      - name: Smoke-test container startup
        run: |
          docker run -d --rm --name beszel-metrics-exporter-test -p 9105:9105 beszel-metrics-exporter:test
          trap 'docker logs beszel-metrics-exporter-test || true; docker stop beszel-metrics-exporter-test || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9105/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs beszel-metrics-exporter-test
          exit 1
