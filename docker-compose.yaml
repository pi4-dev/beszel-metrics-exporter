services:
  beszel-metrics-exporter:
    build: .
    container_name: beszel-metrics-exporter
    restart: unless-stopped

    # Application settings and credentials (separate from Compose's implicit .env).
    env_file: beszel-metrics-exporter.env

    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "9105"

    # Only accessible from the Docker host by default.
    # Change host publishing via a local docker-compose.override.yaml.
    ports:
      - "127.0.0.1:9105:9105"

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
